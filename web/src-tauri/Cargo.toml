[package]
name = "bulder"
version = "1.0.0"
description = "Bulder — экономический симулятор строительной компании"
edition = "2021"

[lib]
name = "bulder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
